# .github/workflows/ci.yml
# Continuous Integration — runs on every push and every PR.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    name: Lint + Type Check + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules and Next.js cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .next/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit

      - name: Push Prisma schema (creates local SQLite for build)
        run: bun run db:push
        env:
          DATABASE_URL: file:./db/ci.db

      - name: Build
        run: bun run build
        env:
          NEXTAUTH_SECRET: ci-test-secret-not-real-do-not-use-in-prod
          NEXTAUTH_URL: http://localhost:3000
          DATABASE_URL: file:./db/ci.db

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: .next/standalone
          retention-days: 7
